<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 320px;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #f9f9f9;
        }

        h3 {
            margin-top: 0;
            color: #006a4e;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 12px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .checkbox-group {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-top: 5px;
        }

        .checkbox-group input {
            width: auto;
            margin-right: 8px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #006a4e;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #00563f;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>
    <h3>Railway Ticket Bot</h3>

    <label>From Station:</label>
    <select id="fromCity">
        <option value="Dhaka">Dhaka</option>
        <option value="Mymensingh">Mymensingh</option>
    </select>
    
    <label>To Station:</label>
    <select id="toCity">
        <option value="Mymensingh">Mymensingh</option>
        <option value="Dhaka">Dhaka</option>
    </select>

    <label>Journey Date:</label>
    <input type="date" id="doj">

    <label>Class:</label>
    <select id="travelClass">
        <option value="AC_B">AC_B</option>
        <option value="AC_S">AC_S</option>
        <option value="SNIGDHA">SNIGDHA</option>
        <option value="F_BERTH">F_BERTH</option>
        <option value="F_SEAT">F_SEAT</option>
        <option value="F_CHAIR">F_CHAIR</option>
        <option value="S_CHAIR">S_CHAIR</option>
        <option value="SHOVAN">SHOVAN</option>
        <option value="SHULOV">SHULOV</option>
        <option value="AC_CHAIR">AC_CHAIR</option>
    </select>

    <label>Train Name (Optional):</label>
    <input type="text" id="trainName" placeholder="e.g., Subarna Express">

    <label>Total Tickets:</label>
    <input type="number" id="totalTickets" value="1" min="1" max="4">

    <div class="checkbox-group">
        <label><input type="checkbox" id="autoSeats" checked> Auto select available seats</label>
        <label><input type="checkbox" id="autoContinue" checked> Auto continue to purchase</label>
        <label><input type="checkbox" id="fallbackTrain" checked> Fallback to any train if selected is
            unavailable</label>
    </div>

    <button id="startBot">Start Bot</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>

</html>
